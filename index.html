<style>
/* Inline critical banner + regulatory styles (defense-in-depth against cached styles.css) */
.reg-banner { position: fixed; top: 0; left: 0; right: 0; height: 44px; background: #0F0906; color: #FAF6EE; z-index: 120; display: flex; align-items: center; border-bottom: 1px solid rgba(250,246,238,0.08); }
.reg-banner-accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #E89B3C; box-shadow: 0 0 16px rgba(232,155,60,0.6); }
.reg-banner-inner { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.reg-banner-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; overflow: hidden; }
.reg-banner-dot { flex-shrink: 0; width: 7px; height: 7px; border-radius: 50%; background: #E89B3C; box-shadow: 0 0 8px #E89B3C; animation: regPulse 2s ease-in-out infinite; }
@keyframes regPulse { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }
.reg-banner-text { color: rgba(250,246,238,0.9); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.reg-highlight { color: #E89B3C; font-weight: 500; }
.reg-banner-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.reg-banner-link { color: #E89B3C; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; transition: opacity 200ms; text-decoration: none; white-space: nowrap; }
.reg-banner-link:hover { opacity: 0.8; }
.reg-banner-close { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: rgba(250,246,238,0.5); border-radius: 50%; transition: all 200ms; background: transparent; border: 0; cursor: pointer; }
.reg-banner-close:hover { color: #FAF6EE; background: rgba(250,246,238,0.08); }
body.has-banner .nav { top: 44px !important; }
.nav { background: linear-gradient(180deg, rgba(15,10,5,0.55) 0%, rgba(15,10,5,0.3) 60%, rgba(15,10,5,0) 100%); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.nav.scrolled { background: rgba(15,10,5,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.nav-logo .parent, .nav-logo .wordmark, .nav-links a { color: #fff !important; }
.nav-links a { opacity: 0.75; }
.nav-links a:hover, .nav-links a.active { opacity: 1; }
.hero { min-height: 760px; }
body.has-banner .hero { min-height: 820px; }
@media (max-width: 720px) {
  .reg-banner { height: 56px; }
  .reg-banner-text { white-space: normal; font-size: 12px; line-height: 1.35; }
  .reg-banner-link span { display: none; }
  body.has-banner .nav { top: 56px !important; }
}

<script type="text/babel">
function App() {
  return (
    <React.Fragment>
      <window.RegulatoryBanner/>
      <window.Nav/>
      <main>
        <window.Hero/>
        <window.RegulatoryMoment/>
        <window.Problem/>
        <window.Meet/>
        <window.WhyRootOnly/>
        <window.EdgePlatform/>
        <window.ClinicalEvidence/>
        <window.Outcomes/>
        <window.Applications/>
        <window.Trust/>
        <window.FAQ/>
        <window.FinalCTA/>
      </main>
      <window.Footer/>
    </React.Fragment>
  );
}

function tryMount() {
  const ready = ['Nav','Hero','RegulatoryBanner','RegulatoryMoment','Problem','Meet','WhyRootOnly','EdgePlatform','ClinicalEvidence','Outcomes','Applications','Trust','FAQ','FinalCTA','Footer','Icon'].every(k => window[k]);
  if (ready) {
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  } else {
    setTimeout(tryMount, 50);
  }
}
tryMount();
</script>
